name: Update Star History

on:
  schedule:
    # 每天 UTC 01:17 更新（避开整点，GitHub 定时任务尽量错峰）
    - cron: "17 1 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: star-history
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout main (for scripts)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # 拉全部分支（含 star-history），判断是否已存在

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Snapshot star count
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node .github/scripts/star-history-data.mjs snapshot EthanZer0/FaceLogin .star-history-data

      - name: Generate SVG
        run: node .github/scripts/star-history-svg.mjs .star-history-data/history.json .star-history-data/star-history.svg

      - name: Show result
        run: |
          echo "=== history.json ==="
          tail -5 .star-history-data/history.json
          echo "=== svg ==="
          ls -la .star-history-data/star-history.svg

      - name: Commit to star-history branch
        run: |
          set -e
          BRANCH="star-history"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # 准备独立 worktree 目录
          rm -rf .star-history-gh-pages
          mkdir -p .star-history-gh-pages

          # 首次运行：创建 orphan 分支；否则检出已有分支
          if git rev-parse --verify "refs/remotes/origin/${BRANCH}" >/dev/null 2>&1; then
            git worktree add .star-history-gh-pages "origin/${BRANCH}" -B "${BRANCH}" >/dev/null 2>&1
          else
            git worktree add --detach .star-history-gh-pages >/dev/null 2>&1
            git -C .star-history-gh-pages checkout --orphan "${BRANCH}" >/dev/null 2>&1
            git -C .star-history-gh-pages rm -rf . >/dev/null 2>&1 || true
          fi

          # 复制产物（保持 history.json 的累积）
          cp .star-history-data/history.json .star-history-gh-pages/history.json
          cp .star-history-data/star-history.svg .star-history-gh-pages/star-history.svg

          # 提交（幂等：无变化则不产生空提交）
          cd .star-history-gh-pages
          git add history.json star-history.svg
          if ! git diff --cached --quiet; then
            git commit -m "Update star history ($(date +%Y-%m-%d))"
            git push origin "${BRANCH}"
          else
            echo "无变化，跳过提交"
          fi
          cd ..
          git worktree remove .star-history-gh-pages --force
