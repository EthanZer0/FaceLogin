name: Update Star History

# 触发器：仅负责 schedule 触发 + 从 star-history 分支运行脚本。
# 所有脚本与数据都隔离在 star-history 分支，main 不维护任何 star-history 逻辑。
on:
  schedule:
    # 每天 UTC 01:17 更新（避开整点，GitHub 定时任务尽量错峰）
    - cron: "17 1 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: star-history
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout star-history branch (self-contained scripts + data)
        uses: actions/checkout@v4
        with:
          ref: star-history
          fetch-depth: 0   # 拉全部分支，判断历史是否已存在

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Prepare data dir
        run: |
          set -e
          mkdir -p .star-history-data
          # 已 checkout star-history 分支：history.json 与 .github/scripts 都在工作区。
          if [ -f history.json ]; then
            cp history.json .star-history-data/history.json
            echo "已载入历史: $(grep -c '\"date\"' .star-history-data/history.json) 天"
          else
            echo "分支无 history.json，从空历史起步"
          fi

      - name: Snapshot star count
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node .github/scripts/star-history-data.mjs snapshot EthanZer0/FaceLogin .star-history-data

      - name: Generate SVG
        run: node .github/scripts/star-history-svg.mjs .star-history-data/history.json .star-history-data/star-history.svg EthanZer0/FaceLogin

      - name: Show result
        run: |
          echo "=== history.json ==="
          tail -5 .star-history-data/history.json
          echo "=== svg ==="
          ls -la .star-history-data/star-history.svg

      - name: Commit to star-history branch
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # 产物复制回工作区根目录（累积 history + SVG），保持分支上文件稳定。
          cp .star-history-data/history.json history.json
          cp .star-history-data/star-history.svg star-history.svg

          # 工作区已是 star-history 分支，直接原地提交产物。
          git add history.json star-history.svg
          if ! git diff --cached --quiet; then
            git commit -m "Update star history ($(date +%Y-%m-%d))"
            git push origin star-history
          else
            echo "无变化，跳过提交"
          fi
